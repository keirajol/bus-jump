<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Laatste Bus</title>
<style>
  html,body{margin:0;height:100%;background:#0b1026;}
  body{display:flex;align-items:center;justify-content:center;}
  canvas{width:min(100vw,1000px);aspect-ratio:2/1;display:block;cursor:pointer;touch-action:manipulation;}
</style>
</head>
<body>
<canvas id="c" width="800" height="400"></canvas>
<script>
const cv = document.getElementById('c'), ctx = cv.getContext('2d');
const W = 400, H = 200, GROUND = 160, PX = 80;
const FONT = "'Courier New', monospace";
const C = {
  sky:'#1a2150', far:'#161c45', near:'#0e1232', sil:'#05060c', win:'#e9c46a',
  lamp:'#f4d27a', text:'#efe3bf', street:'#151a3a', curb:'#2a3168', red:'#ff6b5b'
};

let state = 'title', level = 1, best = 0, t = 0, endT = 0;
try { best = +localStorage.getItem('laatstebus_best') || 0; } catch (e) {}

let p, obs, worldX, timeLeft, L, busX, busV, bubble, lamps, dogs, far, near, floats, stumbles, farMsg;
const stars = Array.from({length: 45}, () => ({x: Math.random()*W, y: Math.random()*95, s: Math.random()}));

const winLines  = ['net op tijd.', 'instappen.', 'goeienavond.', 'hup, erin.', 'rennen helpt, hè?'];
const loseLines = ['pech.', 'morgen weer.', 'ik wacht niet hoor.', 'volgende keer.', 'tsja.'];
const pick = a => a[Math.floor(Math.random()*a.length)];

function mkCity(par, minH, maxH, chance) {
  const arr = []; let x = -60;
  const span = (L + 600) * par + W;
  while (x < span) {
    const w = 28 + Math.random()*50, h = minH + Math.random()*(maxH-minH);
    const wins = [];
    for (let wy = GROUND-h+6; wy < GROUND-10; wy += 9)
      for (let wx = x+4; wx < x+w-6; wx += 8)
        if (Math.random() < chance) wins.push([Math.round(wx), Math.round(wy)]);
    arr.push({x, w, h, wins});
    x += w + Math.random()*10;
  }
  return arr;
}

function mkLevel() {
  L = 1400 + 400*(level-1);
  timeLeft = L/90 + Math.max(2.2, 6 - level*0.6);
  worldX = 0; stumbles = 0; endT = 0; farMsg = false;
  p = {y: GROUND, vy: 0, on: true, slow: 0};
  obs = []; floats = [];
  let x = 240;
  while (x < L - 70) {
    const r = Math.random();
    let type = r < 0.45 ? 'puddle' : r < 0.8 ? 'bag' : 'cat';
    if (level < 2 && type === 'cat' && Math.random() < 0.5) type = 'bag';
    obs.push({type, x, hit: false});
    const gMin = Math.max(70, 115 - level*6), gMax = Math.max(115, 195 - level*10);
    x += gMin + Math.random()*(gMax-gMin);
  }
  lamps = [];
  for (let i = 40; i < L + 500; i += 130) lamps.push({x: i, flick: Math.random() < 0.25});
  dogs = [];
  for (let i = 520; i < L - 250; i += 600 + Math.random()*400) dogs.push({x: i, barked: false});
  far  = mkCity(0.15, 50, 95, 0.12);
  near = mkCity(0.4, 30, 70, 0.22);
  busX = L + 18; busV = 0; bubble = null;
}

/* ---------- geluid ---------- */
let ac = null, muted = false;
function beep(f, d, type='square', vol=0.04, slide=0, delay=0) {
  if (muted) return;
  try {
    ac = ac || new (window.AudioContext || window.webkitAudioContext)();
    const s = ac.currentTime + delay;
    const o = ac.createOscillator(), g = ac.createGain();
    o.type = type; o.frequency.setValueAtTime(f, s);
    if (slide) o.frequency.exponentialRampToValueAtTime(slide, s + d);
    g.gain.setValueAtTime(vol, s);
    g.gain.exponentialRampToValueAtTime(0.0001, s + d);
    o.connect(g).connect(ac.destination);
    o.start(s); o.stop(s + d + 0.02);
  } catch (e) {}
}

/* ---------- invoer ---------- */
function action() {
  if (state === 'title') { mkLevel(); state = 'run'; return; }
  if (state === 'run') {
    if (p.on) { p.vy = -175; p.on = false; beep(320, 0.12, 'square', 0.035, 640); }
    return;
  }
  if (state === 'won' && endT > 1.4) { level++; mkLevel(); state = 'run'; return; }
  if (state === 'lost' && endT > 1.0) { mkLevel(); state = 'run'; }
}
addEventListener('keydown', e => {
  if (e.code === 'Space' || e.code === 'ArrowUp' || e.code === 'KeyW') { e.preventDefault(); if (!e.repeat) action(); }
  if (e.code === 'KeyM') muted = !muted;
});
cv.addEventListener('pointerdown', e => { e.preventDefault(); action(); });

function addFloat(x, y, s, col) { floats.push({x, y, s, a: 0, col: col || C.text}); }

/* ---------- update ---------- */
function update(dt) {
  t += dt;
  floats.forEach(f => { f.a += dt; f.y -= 14*dt; });
  floats = floats.filter(f => f.a < 0.9);

  if (state === 'run') {
    const speed = p.slow > 0 ? 22 : 90;
    p.slow -= dt;
    worldX += speed*dt;
    timeLeft -= dt;

    if (!p.on) {
      p.vy += 560*dt; p.y += p.vy*dt;
      if (p.y >= GROUND) { p.y = GROUND; p.on = true; p.vy = 0; }
    }

    for (const o of obs) {
      if (o.type === 'cat' && o.x - worldX < W) o.x -= 22*dt;
      if (o.hit) continue;
      const sx = o.x - worldX;
      const w = o.type === 'puddle' ? 20 : o.type === 'bag' ? 10 : 12;
      const h = o.type === 'puddle' ? 1.5 : o.type === 'bag' ? 11 : 9;
      if (sx < 4 && sx + w > -4 && p.y > GROUND - h) {
        o.hit = true; stumbles++; p.slow = 0.9;
        const word = o.type === 'puddle' ? 'plons!' : o.type === 'bag' ? 'au!' : 'MIAUW';
        addFloat(worldX + 2, GROUND - 30, word);
        if (o.type === 'cat') { beep(900, 0.25, 'triangle', 0.035, 500); o.x += 40; }
        else beep(140, 0.22, 'sawtooth', 0.04, 60);
      }
    }

    for (const d of dogs) {
      if (!d.barked && d.x - worldX < 30) {
        d.barked = true;
        addFloat(d.x, GROUND - 22, 'WAF!');
        beep(480, 0.07, 'square', 0.03, 260); beep(480, 0.07, 'square', 0.03, 260, 0.13);
      }
    }

    if (worldX >= L - 4) {
      worldX = L - 4; state = 'won'; endT = 0; bubble = pick(winLines);
      if (level > best) { best = level; try { localStorage.setItem('laatstebus_best', best); } catch (e) {} }
      beep(523, 0.12, 'square', 0.035); beep(659, 0.12, 'square', 0.035, 0, 0.12); beep(784, 0.2, 'square', 0.035, 0, 0.24);
    } else if (timeLeft <= 0) {
      timeLeft = 0; state = 'lost'; endT = 0; bubble = pick(loseLines);
      farMsg = busX - worldX + PX > W;
      beep(220, 0.5, 'sawtooth', 0.03); beep(277, 0.5, 'sawtooth', 0.03);
    }
  } else if (state === 'won' || state === 'lost') {
    endT += dt;
    const go = state === 'lost' || endT > 0.9;
    if (go) { busV = Math.min(140, busV + 50*dt); busX += busV*dt; }
  }
}

/* ---------- tekenen ---------- */
function rect(c, x, y, w, h) { ctx.fillStyle = c; ctx.fillRect(Math.round(x), Math.round(y), w, h); }
function text(s, x, y, size, col, align='center', bold=true) {
  ctx.font = (bold ? 'bold ' : '') + size + 'px ' + FONT;
  ctx.fillStyle = col; ctx.textAlign = align; ctx.textBaseline = 'middle';
  ctx.fillText(s, x, y);
}

function drawBackground() {
  rect(C.sky, 0, 0, W, H);
  for (const s of stars) {
    ctx.globalAlpha = 0.35 + 0.4*Math.abs(Math.sin(t*0.8 + s.s*20));
    rect('#cfd6ff', s.x, s.y, 1, 1);
  }
  ctx.globalAlpha = 1;
  ctx.fillStyle = '#efe3c2'; ctx.beginPath(); ctx.arc(335, 34, 11, 0, 7); ctx.fill();
  ctx.fillStyle = C.sky;     ctx.beginPath(); ctx.arc(330, 31, 10, 0, 7); ctx.fill();

  for (const [layer, par, col, wa] of [[far, 0.15, C.far, 0.45], [near, 0.4, C.near, 0.9]]) {
    const off = worldX*par;
    for (const b of layer) {
      const bx = b.x - off;
      if (bx > W || bx + b.w < 0) continue;
      rect(col, bx, GROUND - b.h, Math.ceil(b.w), b.h);
      ctx.globalAlpha = wa;
      for (const [wx, wy] of b.wins) rect(C.win, wx - off, wy, 3, 4);
      ctx.globalAlpha = 1;
    }
  }
  rect(C.street, 0, GROUND, W, H - GROUND);
  rect(C.curb, 0, GROUND, W, 1);
  for (let i = -((worldX*1) % 40); i < W; i += 40) rect('#1d2350', i, GROUND + 18, 20, 1);
}

function lampOn(l) {
  if (!l.flick) return true;
  return Math.sin(t*31 + l.x) > -0.85 && Math.sin(t*2.7 + l.x*1.3) > -0.6;
}
function drawLamps() {
  for (const l of lamps) {
    const sx = Math.round(l.x - worldX + PX);
    if (sx < -40 || sx > W + 40) continue;
    const on = lampOn(l);
    if (on) {
      ctx.globalAlpha = 0.07; ctx.fillStyle = C.lamp;
      ctx.beginPath(); ctx.moveTo(sx+6, GROUND-55); ctx.lineTo(sx+11, GROUND-55);
      ctx.lineTo(sx+34, GROUND); ctx.lineTo(sx-16, GROUND); ctx.fill();
      ctx.globalAlpha = 0.12;
      ctx.beginPath(); ctx.ellipse(sx+9, GROUND+3, 26, 4, 0, 0, 7); ctx.fill();
      ctx.globalAlpha = 1;
    }
    rect(C.sil, sx, GROUND-58, 2, 58);
    rect(C.sil, sx, GROUND-58, 9, 2);
    rect(on ? C.lamp : '#3a3a4a', sx+6, GROUND-56, 5, 2);
  }
}

function drawDogs() {
  for (const d of dogs) {
    const sx = Math.round(d.x - worldX + PX);
    if (sx < -60 || sx > W + 60) continue;
    for (let i = -22; i < 30; i += 5) rect('#0a0d22', sx + i, GROUND - 12, 2, 12);
    rect('#0a0d22', sx - 22, GROUND - 10, 52, 1);
    rect('#0a0d22', sx - 22, GROUND - 5, 52, 1);
    const bounce = (d.barked && worldX - d.x < 60) ? Math.round(Math.abs(Math.sin(t*14))) : 0;
    rect(C.sil, sx, GROUND - 8 - bounce, 10, 5);
    rect(C.sil, sx - 3, GROUND - 12 - bounce, 5, 5);
    rect(C.sil, sx - 3, GROUND - 13 - bounce, 1, 2);
    rect(C.sil, sx + 1, GROUND - 3, 1, 3); rect(C.sil, sx + 8, GROUND - 3, 1, 3);
    rect(C.sil, sx + 10, GROUND - 10 - bounce + Math.round(Math.sin(t*10)), 1, 3);
  }
}

function drawObstacles() {
  for (const o of obs) {
    const sx = Math.round(o.x - worldX + PX);
    if (sx < -30 || sx > W + 10) continue;
    if (o.type === 'puddle') {
      ctx.fillStyle = '#34468f';
      ctx.beginPath(); ctx.ellipse(sx+10, GROUND+2, 10, 2.2, 0, 0, 7); ctx.fill();
      rect('#8094d8', sx+5, GROUND+1, 4, 1);
      if (o.hit) { ctx.globalAlpha = 0.6; rect('#8094d8', sx+2, GROUND-2, 1, 1); rect('#8094d8', sx+16, GROUND-3, 1, 1); ctx.globalAlpha = 1; }
    } else if (o.type === 'bag') {
      const tip = o.hit ? 2 : 0;
      rect('#2a2f4a', sx + tip, GROUND-8, 10, 8);
      rect('#2a2f4a', sx + 1 + tip, GROUND-10, 8, 2);
      rect('#2a2f4a', sx + 4 + tip, GROUND-12, 2, 2);
      rect('#454c75', sx + 2 + tip, GROUND-7, 1, 4);
    } else {
      const step = Math.round(Math.sin(t*12)) ;
      rect(C.sil, sx+2, GROUND-6, 9, 4);
      rect(C.sil, sx+3 + step, GROUND-2, 1, 2); rect(C.sil, sx+9 - step, GROUND-2, 1, 2);
      rect(C.sil, sx, GROUND-9, 4, 4);
      rect(C.sil, sx, GROUND-10, 1, 1); rect(C.sil, sx+3, GROUND-10, 1, 1);
      rect(C.sil, sx+11, GROUND-10, 1, 5); rect(C.sil, sx+12, GROUND-11, 1, 1);
      rect('#f2d14b', sx+1, GROUND-8, 1, 1);
    }
  }
}

function drawStopAndBus() {
  const ss = Math.round(L + 6 - worldX + PX);
  if (ss > -20 && ss < W + 20) {
    rect('#8a8fa8', ss, GROUND-34, 2, 34);
    rect('#f2c94c', ss-4, GROUND-43, 10, 10);
    text('H', ss+1, GROUND-37.5, 8, '#1a1a1a');
  }
  const bx = Math.round(busX - worldX + PX);
  if (bx > W + 5 || bx < -110) return;
  rect('#2e6f8e', bx, GROUND-38, 92, 32);
  rect('#245a74', bx, GROUND-38, 92, 3);
  rect('#1f4a5e', bx, GROUND-10, 92, 4);
  const doorOpen = state === 'won' && endT < 0.9;
  rect(doorOpen ? C.win : '#1f4a5e', bx+3, GROUND-31, 8, 23);
  for (let i = 0; i < 5; i++) rect(C.win, bx+15 + i*13, GROUND-33, 10, 10);
  rect(C.win, bx+82, GROUND-33, 9, 14);
  rect(C.sil, bx+84, GROUND-29, 4, 6);
  rect('#0c0c12', bx+56, GROUND-37, 22, 5);
  text('N12', bx+67, GROUND-34.3, 4.5, '#ff9a3c');
  rect('#fff3c4', bx+90, GROUND-13, 2, 3);
  ctx.globalAlpha = 0.08; ctx.fillStyle = '#fff3c4';
  ctx.beginPath(); ctx.moveTo(bx+92, GROUND-13); ctx.lineTo(bx+150, GROUND-22); ctx.lineTo(bx+150, GROUND); ctx.lineTo(bx+92, GROUND-10); ctx.fill();
  ctx.globalAlpha = 1;
  for (const wx of [18, 74]) {
    ctx.fillStyle = '#07080f'; ctx.beginPath(); ctx.arc(bx+wx, GROUND-5, 5, 0, 7); ctx.fill();
    rect('#555b70', bx+wx-1, GROUND-6, 2, 2);
  }
  if (bubble && endT < 3.5) drawBubble(bubble, bx + 70, GROUND - 52);
}

function drawBubble(s, x, y) {
  ctx.font = 'bold 6px ' + FONT;
  const w = ctx.measureText(s).width + 10;
  const bx = Math.max(4, Math.min(W - w - 4, x - w/2));
  rect(C.text, bx, y - 6, w, 12);
  rect(C.text, x - 1, y + 6, 3, 3);
  text(s, bx + w/2, y, 6, '#1a1424');
}

function drawPlayer() {
  if (state === 'won' && endT > 0.45) return;
  let x = PX, y = Math.round(p.y);
  if (state === 'won') x += Math.round(endT * 20);
  ctx.save(); ctx.translate(x, y);
  if (p.slow > 0 && state === 'run') ctx.rotate(0.35 * Math.min(1, p.slow*2));
  if (state === 'lost') ctx.rotate(-0.08);
  const moving = state === 'run' || state === 'won';
  let a = p.on ? Math.sin(worldX*0.18) * 4 : 2.5;
  if (!moving) a = 0.5;
  ctx.lineWidth = 2; ctx.lineCap = 'butt';
  ctx.strokeStyle = '#1a1424';
  ctx.beginPath(); ctx.moveTo(0, -7); ctx.lineTo(a, 0); ctx.moveTo(1, -7); ctx.lineTo(-a, p.on ? 0 : -2); ctx.stroke();
  rect('#c8553d', -3, -17, 7, 11);
  rect('#e9c46a', -3, -17, 7, 2);
  rect('#e9c46a', -7 + Math.round(Math.sin(t*12)), -16 + (moving ? 0 : 3), 4, 2);
  ctx.strokeStyle = '#9e3f2d';
  ctx.beginPath(); ctx.moveTo(1, -15); ctx.lineTo(1 - a, moving ? -10 : -9); ctx.stroke();
  rect('#f0c9a0', -2, -23, 6, 6);
  rect('#2a1d1a', -3, -24, 7, 2);
  rect('#2a1d1a', 2, -21, 1, 1);
  ctx.restore();
}

function drawFloats() {
  for (const f of floats) {
    ctx.globalAlpha = Math.max(0, 1 - f.a/0.9);
    text(f.s, f.x - worldX + PX, f.y, 7, f.col);
  }
  ctx.globalAlpha = 1;
}

function fmt(s) { s = Math.max(0, Math.ceil(s)); return Math.floor(s/60) + ':' + String(s%60).padStart(2, '0'); }

function drawHud() {
  if (state === 'title') return;
  text('halte ' + level, 8, 10, 7, C.text, 'left');
  const urgent = timeLeft < 5 && state === 'run';
  const col = urgent && Math.floor(t*4) % 2 ? C.red : C.text;
  text('N12 gaat over ' + fmt(timeLeft), W - 8, 10, 7, col, 'right');
  rect('#2a3168', 20, 192, 360, 1);
  rect('#f2c94c', 378, 189, 4, 5);
  rect('#c8553d', 20 + 356 * Math.min(1, worldX / L), 190, 3, 3);
}

function panel(lines) {
  ctx.fillStyle = 'rgba(5,6,15,0.72)'; ctx.fillRect(70, 45, 260, 95);
  lines.forEach(([s, size, col], i) => text(s, W/2, 62 + i*16, size, col || C.text, 'center', size > 7));
}

function drawOverlay() {
  if (state === 'title') {
    panel([
      ['LAATSTE BUS', 16, C.win],
      ['23:47. de N12 gaat zo.', 7],
      ['spatie / klik = springen', 7],
      [best ? 'verste halte: ' + best : 'm = geluid aan/uit', 6, '#9aa3d6'],
      ['druk op spatie om te rennen', 6, '#9aa3d6'],
    ]);
  } else if (state === 'won' && endT > 1.4) {
    panel([
      ['gehaald.', 14, C.win],
      ['halte ' + level + ' · ' + stumbles + 'x gestruikeld', 7],
      ['nog ' + fmt(timeLeft) + ' over', 7],
      ['', 6],
      ['spatie = volgende halte', 6, '#9aa3d6'],
    ]);
  } else if (state === 'lost' && endT > 1.0) {
    panel([
      ['gemist.', 14, C.red],
      [farMsg ? 'in de verte rijdt de N12 weg...' : 'je ziet de achterlichten gaan.', 7],
      ['nog ' + Math.max(0, Math.round(L - worldX)) + ' meter tot de halte', 7],
      ['', 6],
      ['spatie = opnieuw', 6, '#9aa3d6'],
    ]);
  }
}

function draw() {
  ctx.setTransform(2, 0, 0, 2, 0, 0);
  drawBackground();
  drawLamps();
  drawDogs();
  drawStopAndBus();
  drawObstacles();
  drawPlayer();
  drawFloats();
  drawHud();
  drawOverlay();
}

let last = performance.now();
function loop(now) {
  const dt = Math.min(0.05, (now - last) / 1000); last = now;
  update(dt); draw();
  requestAnimationFrame(loop);
}
mkLevel();
requestAnimationFrame(loop);
</script>
</body>
</html>
